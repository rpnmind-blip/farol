<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102747">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Farol">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Teste o Farol · Demonstração</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <style>
    .demo-return{position:sticky;top:0;z-index:15;min-height:48px;padding:6px max(14px,env(safe-area-inset-left)) 6px max(14px,env(safe-area-inset-right));padding-top:calc(6px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-bottom:1px solid #dce5ef;box-shadow:0 3px 10px #1027470a}
    .demo-return a{color:#102747;font-size:12px;font-weight:700;text-decoration:none;min-height:40px;display:inline-flex;align-items:center;gap:8px}
    .demo-return a:focus-visible{outline:3px solid #2864e8;outline-offset:2px;border-radius:5px}
    .demo-return img{width:20px;height:23px}
    .demo-return span{font-size:10px;color:#70849a;text-align:right}
    @media(min-width:650px){.demo-return{max-width:640px;margin-inline:auto;border-inline:1px solid #dce5ef}.screen{min-height:calc(100vh - 48px)}}
    @media(max-width:350px){.demo-return span{font-size:9px}}
  </style>
  <script src="app.js" defer></script>
  <script src="../pwa.js" defer></script>
</head>
<body>
  <header class="demo-return"><a href="../"><img src="../assets/logo.svg" alt="">← Voltar para a apresentação</a><span>Protótipo · dados simulados</span></header>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
